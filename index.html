<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <meta property="og:title" content="FARTBURN - BURN TERMINAL">
    <meta property="og:description" content="The ultimate auto-buy & auto-burn bot for $FARTBURN on Solana. Press F to fart 💨">
    <meta property="og:image" content="https://fartburn.vercel.app/og-image.png">
    <meta property="og:url" content="https://fartburn.vercel.app/">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FARTBURN - BURN TERMINAL">
    <meta name="twitter:description" content="The ultimate auto-buy & auto-burn bot for $FARTBURN on Solana. Press F to fart 💨">
    <meta name="twitter:image" content="https://fartburn.vercel.app/og-image.png">
    <title>$FARTBURN - BURN TERMINAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #00ff00;
            font-family: 'VT323', monospace;
            font-size: 20px;
            overflow: hidden;
            image-rendering: pixelated;
        }

        .crt {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(0,255,0,0.03) 50%, transparent 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            box-shadow: inset 0 0 80px rgba(0,255,0,0.3);
        }

        .terminal {
            width: 100vw;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            border: 8px solid #00ff00;
            background: #000;
            position: relative;
        }

        .titlebar {
            background: #00aa00;
            color: #000;
            padding: 4px 10px;
            font-size: 30px;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 2px 2px 0 #fff;
        }

        #output {
            height: calc(100vh - 180px);
            overflow-y: auto;
            white-space: pre-wrap;
            line-height: 1.3;
            padding-right: 20px;
        }

        #output::-webkit-scrollbar {
            width: 12px;
        }

        #output::-webkit-scrollbar-thumb {
            background: #00ff00;
        }

        .prompt-line {
            display: flex;
            margin-top: 8px;
        }

        .prompt {
            color: #00ff00;
            margin-right: 8px;
            user-select: none;
        }

        #input {
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'VT323', monospace;
            font-size: 20px;
            outline: none;
            flex: 1;
            caret-color: #00ff00;
        }

        .blink {
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .fart {
            color: #ff00ff;
            animation: shake 0.3s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="titlebar">FARTBURN TERMINAL — v1.0.42069 — PRESS F TO FART</div>
        
        <div id="output"></div>
        
        <div class="prompt-line">
            <span class="prompt">C:\FARTBURN></span>
            <input type="text" id="input" autocomplete="off" spellcheck="false">
        </div>
    </div>

    <div class="crt"></div>

    <script src="https://cdn.jsdelivr.net/npm/figlet@1.7.0/lib/figlet.js"></script>

<script>
    const output = document.getElementById('output');
    const input = document.getElementById('input');

    const CONTRACT = "Coming Soon!";


    const fartFiles = [
        "fart1.mp3",
        "fart2.mp3",
        "fart3.mp3",
        "fart4.mp3",
        "fart5.mp3",
        "fart6.mp3"
    ];

    function playRandomFart() {
        const randomFile = fartFiles[Math.floor(Math.random() * fartFiles.length)];
        const audio = new Audio(randomFile);
        audio.volume = 0.4; 
        audio.currentTime = 0;
        audio.play().catch(() => {}); 
    }

    function print(text, className = "", isHTML = false) {
        const line = document.createElement('div');
        if (className) line.className = className;
        
        if (isHTML) {
            line.innerHTML = text;
        } else {
            line.textContent = text;
        }
        
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;

        playRandomFart();
    }

        function bootSequence() {
            print("Microsoft Fart Systems [Version 1.0.42069]");
            print("(c) 2024-2026 Fart Corporation. All rights reserved.");
            print("");
            print("INITIALIZING FART PROTOCOL...");
            print("");
            print("FARTBURN — The ultimate auto-burn machine 💨🔥");
            print("Buying high • Burning higher • No mercy");
            print("");
            print("Type 'help' for commands. Press F to fart.");
        }

        function showBanner() {
            figlet("FARTBURN", { font: "Big" }, (err, data) => {
                if (err) {
                    print("=== FARTBURN TERMINAL ===");
                    return;
                }
                data.split("\n").forEach(line => {
                    if (line.trim()) print(line);
                });
                print("");
            });
        }

        let botWS;
        function connectToBot() {
            botWS = new WebSocket("wss://loveburns.ngrok.app"); 

            botWS.onopen = () => {
                print("💨 Connected to Buy & Auto-Burn Bot");
            };

            botWS.onmessage = (event) => {
                print("" + event.data);
            };

            botWS.onclose = () => {
                print("[BOT] Disconnected — Reconnecting in 3s...");
                setTimeout(connectToBot, 3000);
            };

            botWS.onerror = () => {
                print("[BOT] Connection error — retrying...");
            };
        }

        const commands = {
            help: () => {
                print("Available commands:");
                print("  about          — What is $FARTBURN?");
                print("  ca             — Copy contract address");
                print("  roadmap        — Future of burns");
                print("  socials        — Join the stink");
                print("  buy            — Buy $FARTBURN");
                print("  fart           — Test the gas");
                print("  moon           — Simulate liftoff");
                print("  clear          — Clear screen");
            },
            about: () => {
                print("$Fartburn is a pure meme coin on Solana.");
                print("Burning 50% of creator rewards automatically");
                print("");
                print("Born from pure chaos.");
                print("'Burn it all. Fart freely.'");

            },
            ca: () => {
                print("Contract Address: Coming Soon");
                print(`  ${CONTRACT}`);
                print("");
                print("Copied to clipboard!");
                navigator.clipboard.writeText(CONTRACT);
            },

            roadmap: () => {
                print("Phase 1: Launch (done)");
                print("Phase 2: Auto-buy & burn activated");
                print("Phase 3: Make normies say 'what is this shit'");
                print("Phase 4: Burns every minute → MOON");
                print("Phase 5: ???");
                print("Phase 6: Profit (probably not)");
            },
            socials: () => {
    print("Twitter   → <a href='https://x.com/Fartburncoin' target='_blank' style='color:#00ff00; text-decoration:underline;'>https://x.com/Fartburncoin</a>", "", true);
    print("Website   → <a href='https://fartburn.fun' target='_blank' style='color:#00ff00; text-decoration:underline;'>https://fartburn.fun</a>", "", true);
    print("Telegram  → <a href='https://t.me/fartburn' target='_blank' style='color:#00ff00; text-decoration:underline;'>search @fartburn (official community)</a>", "", true);
    print("");
    print("Come stink with us.");
},
            buy: () => {
                print("Opening pump.fun in new tab...");
                setTimeout(() => {
                    window.open(`https://pump.fun/coin/${CONTRACT}`, "_blank");
                }, 800);
            },
            fart: () => {
                print("💨💨💨💨💨💨💨💨💨💨", "fart");
                print(" *PFFFFFFFFFFFFFFFT* ", "fart");
                print("💨💨💨💨💨💨💨💨💨💨", "fart");
            },
            moon: () => {
                print("🚀🚀🚀 TO THE MOON 🚀🚀🚀");
                print("Warning: may cause severe bagholding");
            },
            clear: () => {
                output.innerHTML = "";
            }
        };

        function processCommand(cmd) {
            cmd = cmd.trim().toLowerCase();
            print(`C:\\FARTBURN> ${cmd}`);
            
            if (commands[cmd]) {
                commands[cmd]();
            } else if (cmd === "") {

            } else {
                print(`'${cmd}' is not recognized as a fart command.`);
                print("Type 'help' for a list of stinky commands.");
            }
        }


        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') {
                const fartLines = [
                    "💨 *silent but deadly*",
                    "💨 PFFFTTT",
                    "💨 BRRRRAAAAAPPP",
                    "💨 *wet one* 💦"
                ];
                print(fartLines[Math.floor(Math.random()*fartLines.length)], "fart");
            }
        });


        input.addEventListener('keydown', (e) => {
            if (e.key === "Enter") {
                const cmd = input.value;
                processCommand(cmd);
                input.value = "";
            }
        });


        setTimeout(() => {
            input.focus();
        }, 500);


        bootSequence();
        setTimeout(showBanner, 1000);     
        setTimeout(connectToBot, 2000);    
    </script>

</body>
</html>
