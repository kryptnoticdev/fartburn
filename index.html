            audio.currentTime = 0;
            audio.play().catch(() => {}); 
        }

        function print(text, className = "", isHTML = false) {
            const line = document.createElement('div');
            if (className) line.className = className;
            
            if (isHTML) {
                line.innerHTML = text;
            } else {
                line.textContent = text;
            }
            
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;

            playRandomFart();
        }

            print("");
            print("Type 'help' for commands. Press F to fart.");
        }

        function showBanner() {
            figlet("FARTBURN", { font: "Big" }, (err, data) => {
                if (err) {
                    print("=== FARTBURN TERMINAL ===");
                    return;
                }
                data.split("\n").forEach(line => {
                    if (line.trim()) print(line);
                });
                print("");
            });
        }

        let botWS;
        function connectToBot() {
            botWS = new WebSocket("wss://loveburns.ngrok.app"); 

            botWS.onopen = () => {
                print("💨 Connected to Buy & Auto-Burn Bot");
            };

            botWS.onmessage = (event) => {
                print("" + event.data);
            };

            botWS.onclose = () => {
                print("[BOT] Disconnected — Reconnecting in 3s...");

            botWS.onerror = () => {

        const commands = {
            help: () => {

                print("  buy            — Buy $FARTBURN");
                print("  ca             — Copy contract address");

                print("  fart           — Test the gas");

                print("  roadmap        — Future of burns");
                print("  socials        — Join the stink");
                print("  team           — Meet the team");
                print("======================================");
            },
            about: () => {

                print("Burning 50% of creator rewards automatically");
                print("");

            roadmap: () => {

                print("Phase 4: Burns every minute → MOON");
                print("Phase 5: ???");

                print("======================================");
            },
            socials: () => {

                print("Twitter   → <a href='https://x.com/Fartburncoin' target='_blank' style='color:#00ff00; text-decoration:underline;'>https://x.com/Fartburncoin</a>", "", true);
                print("Website   → <a href='https://fartburn.fun' target='_blank' style='color:#00ff00; text-decoration:underline;'>https://fartburn.fun</a>", "", true);
                print("Telegram  → <a href='https://t.me/fartburn' target='_blank' style='color:#00ff00; text-decoration:underline;'>https://t.me/fartburn</a>", "", true);
                print("");

                print("Kryptnotic    → <a href='https://x.com/kryptnoticdev' target='_blank' style='color:#00ff00; text-decoration:underline;'>@KryptnoticDev</a>", "", true);
                print("Groyal        → <a href='https://x.com/groyalsol' target='_blank' style='color:#00ff00; text-decoration:underline;'>@Groyalsol</a>", "", true);
                print("Joey          → <a href='https://x.com/joeysessi0ns' target='_blank' style='color:#00ff00; text-decoration:underline;'>@JoeySessi0ns</a>", "", true);
                print("AmericanAlpha → <a href='https://x.com/american_a7622' target='_blank' style='color:#00ff00; text-decoration:underline;'>@American_a7622</a>", "", true);
                print("RuggedMan     → <a href='https://x.com/theruggeddev' target='_blank' style='color:#00ff00; text-decoration:underline;'>@TheRuggedDev</a>", "", true);
                print("Fernandez     → <a href='https://x.com/marcfernan55771' target='_blank' style='color:#00ff00; text-decoration:underline;'>@Marcfernan55771</a>", "", true);
                print("Z             → <a href='https://x.com/zakub4u' target='_blank' style='color:#00ff00; text-decoration:underline;'>@Zakub4u</a>", "", true);
                print("Troy          → <a href='https://x.com/duckboy28' target='_blank' style='color:#00ff00; text-decoration:underline;'>@Duckboy28</a>", "", true);
                print("======================================");

                print("Opening pump.fun in new tab...");

            fart: () => {

                print(" *PFFFFFFFFFFFFFFFT* ", "fart");

        function processCommand(cmd) {
            cmd = cmd.trim().toLowerCase();
            print(`C:\\FARTBURN> ${cmd}`);
            
            if (commands[cmd]) {
                commands[cmd]();
            } else if (cmd === "") {

            } else {
                print(`'${cmd}' is not recognized as a fart command.`);
                print("Type 'help' for a list of stinky commands.");
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') {
                const fartLines = [
                    "💨 *silent but deadly*",
                    "💨 PFFFTTT",
                    "💨 BRRRRAAAAAPPP",
                    "💨 *wet one* 💦"
                ];
                print(fartLines[Math.floor(Math.random()*fartLines.length)], "fart");
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === "Enter") {
                const cmd = input.value;
                processCommand(cmd);
                input.value = "";
            }
        });

        setTimeout(() => {
            input.focus();
        }, 500);

        bootSequence();
        setTimeout(showBanner, 1000);     
        setTimeout(connectToBot, 2000);    

        // ────────────────────────────────────────────────
        // Burn Tracker - Fetch from Solana Blockchain
        // ────────────────────────────────────────────────
        // CONFIG – CHANGE THESE
        // ────────────────────────────────────────────────
        const TOKEN_MINT = "9BB6NFEcjBCtnNLFko2FqVQBq8HHM13kCyYcdQbgpump";  // Confirmed $FARTBURN mint from Solscan/pump.fun
        const INITIAL_SUPPLY = 1000000000;                          // Standard pump.fun: 1B tokens – confirm on Solscan if different
        const DECIMALS = 6;                                         // Standard for most pump.fun memes
        const RPC_ENDPOINT = "https://solana-rpc.publicnode.com";         // ← Reliable free public RPC (Ankr)
        const UPDATE_INTERVAL_MS = 15000;                           // 15 seconds

        // ────────────────────────────────────────────────
        const connection = new solanaWeb3.Connection(RPC_ENDPOINT, "confirmed");
        const mintPubkey = new solanaWeb3.PublicKey(TOKEN_MINT);

        const burnAmountEl = document.getElementById("burn-amount");
        const burnStatsEl = document.getElementById("burn-stats");

        let previousBurnt = 0;

        async function fetchBurnedAmount() {
            try {
                console.log("Fetching mint info for:", TOKEN_MINT); // debug
                const mintInfo = await connection.getParsedAccountInfo(mintPubkey);
                console.log("Mint response:", mintInfo); // debug – check browser console (F12)

                if (!mintInfo.value) {
                    throw new Error("Mint account not found – check TOKEN_MINT address");
                }

                const parsed = mintInfo.value.data.parsed;
                if (!parsed || parsed.type !== "mint") {
                    throw new Error("Not a valid mint account");
                }

                const supplyRaw = parsed.info.supply;
                const currentSupply = Number(supplyRaw) / (10 ** DECIMALS);

                const burnt = INITIAL_SUPPLY - currentSupply;

                if (Math.abs(burnt - previousBurnt) > 0.0001) {
                    previousBurnt = burnt;

                    if (burnAmountEl) {
                        burnAmountEl.textContent = burnt.toLocaleString(undefined, {
                            minimumFractionDigits: 0,
                            maximumFractionDigits: 2
                        });
                    }

                    if (burnStatsEl) {
                        burnStatsEl.classList.add("updated");
                        setTimeout(() => burnStatsEl.classList.remove("updated"), 800);
                    }

                    if (burnt > previousBurnt) {
                        print(`🔥 Chain update: ${burnt.toLocaleString()} $FARTBURN burnt total!`, "fart");
                    }
                }
            } catch (err) {
                console.error("Burn fetch failed:", err.message || err);
                if (burnAmountEl) {
                    burnAmountEl.textContent = "Fetch Error";
                }
                // Optional: show in terminal once
                if (!window.burnErrorLogged) {
                    print(`[ERROR] Burn tracker failed: ${err.message || "Unknown RPC issue"} – check console (F12)`, "fart");
                    window.burnErrorLogged = true;
                }
            }
        }

        // Initial fetch + periodic updates
        fetchBurnedAmount();
        setInterval(fetchBurnedAmount, UPDATE_INTERVAL_MS);

        // Set initial state
        if (burnAmountEl) burnAmountEl.textContent = "0";
    </script>
