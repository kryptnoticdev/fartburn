        function playRandomFart() {
            const randomFile = fartFiles[Math.floor(Math.random() * fartFiles.length)];

            audio.volume = 0.4;

function print(text, className = "", isHTML = false) {
    return new Promise((resolve) => {
        const line = document.createElement('div');
        if (className) line.className = className;
        output.appendChild(line);

        if (isHTML) {
            line.innerHTML = text;
            output.scrollTop = output.scrollHeight;
            playRandomFart();
            resolve();
            return;
        }

        const words = text.split(' ');
        let i = 0;

        function typeWord() {
            if (i < words.length) {
                const space = (i > 0 ? ' ' : '');
                line.textContent += space + words[i];
                output.scrollTop = output.scrollHeight;
                i++;
                setTimeout(typeWord, typingDelay + Math.random() * 40 - 20);
            } else {
                playRandomFart();
                resolve();
            }
        }

        typeWord();
    });
}

        const TOKEN_MINT = "COMING SOON";
        const INITIAL_SUPPLY = 1000000000;
        const DECIMALS = 6;
        const RPC_ENDPOINT = "https://mainnet.helius-rpc.com/?api-key=656e4389-f6c0-4575-a708-5982fd8ee655";
        const UPDATE_INTERVAL_MS = 15000;                           // 15 seconds

        const connection = new solanaWeb3.Connection(RPC_ENDPOINT, "confirmed");
        const mintPubkey = new solanaWeb3.PublicKey(TOKEN_MINT);

        let previousBurnt = 0;

        async function fetchBurnedAmount() {
            try {
                console.log("Fetching mint info for:", TOKEN_MINT);
                const mintInfo = await connection.getParsedAccountInfo(mintPubkey);
                console.log("Mint response:", mintInfo);

                if (!mintInfo.value) {
                    throw new Error("Mint account not found – check TOKEN_MINT address");
                }

                const parsed = mintInfo.value.data.parsed;
                if (!parsed || parsed.type !== "mint") {
                    throw new Error("Not a valid mint account");
                }

                const supplyRaw = parsed.info.supply;
                const currentSupply = Number(supplyRaw) / (10 ** DECIMALS);

                const burnt = INITIAL_SUPPLY - currentSupply;

                if (Math.abs(burnt - previousBurnt) > 0.0001) {
                    previousBurnt = burnt;

                    if (burnAmountEl) {
                        burnAmountEl.textContent = burnt.toLocaleString(undefined, {
                            minimumFractionDigits: 0,
                            maximumFractionDigits: 2
                        });
                    }

                    if (burnStatsEl) {
                        burnStatsEl.classList.add("updated");
                        setTimeout(() => burnStatsEl.classList.remove("updated"), 800);
                    }

                    if (burnt > previousBurnt) {
                        print(`🔥 Chain update: ${burnt.toLocaleString()} $FARTBURN burnt total!`, "fart");
                    }
                }
            } catch (err) {
                console.error("Burn fetch failed:", err.message || err);
                if (burnAmountEl) {
                    burnAmountEl.textContent = "Fetch Error";
                }

                if (!window.burnErrorLogged) {
                    print(`[ERROR] Burn tracker failed: ${err.message || "Unknown RPC issue"} – check console (F12)`, "fart");
                    window.burnErrorLogged = true;
                }
            }
        }


        fetchBurnedAmount();
        setInterval(fetchBurnedAmount, UPDATE_INTERVAL_MS);


        if (burnAmountEl) burnAmountEl.textContent = "0";


        const observer = new MutationObserver(() => {
            document.querySelectorAll('#output > div').forEach(el => {
                el.style.maxWidth = '100%';
                el.style.wordBreak = 'break-all';
            });
            output.scrollTop = output.scrollHeight;
        });
        observer.observe(output, { childList: true, subtree: true });
    </script>
</body>
</html>
